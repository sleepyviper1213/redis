820.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="237" x2="724" y1="820.6016" y2="820.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="244" y="815.7451">stop request</text><line style="stroke:#181818;stroke-width:1.0;" x1="730" x2="772" y1="867.3047" y2="867.3047"/><line style="stroke:#181818;stroke-width:1.0;" x1="772" x2="772" y1="867.3047" y2="880.3047"/><line style="stroke:#181818;stroke-width:1.0;" x1="731" x2="772" y1="880.3047" y2="880.3047"/><polygon fill="#181818" points="741,876.3047,731,880.3047,741,884.3047,737,880.3047" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168" x="737" y="846.0967">the cancelled wait completes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135" x="737" y="862.4482">on the watchdog thread</text><polygon fill="#181818" points="248,906.6563,238,910.6563,248,914.6563,244,910.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="242" x2="729" y1="910.6563" y2="910.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237" x="254" y="905.7998">continues_on(io_): back to the event loop</text><path d="M110,923.6563 L110,965.6563 L363,965.6563 L363,933.6563 L353,923.6563 L110,923.6563 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M353,923.6563 L353,933.6563 L363,933.6563 L353,923.6563 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216" x="116" y="942.1514">A work guard has kept io_.run() going</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232" x="116" y="958.5029">this long: io_ had no work of its own left.</text><line style="stroke:#181818;stroke-width:1.0;" x1="237" x2="279" y1="1010.0625" y2="1010.0625"/><line style="stroke:#181818;stroke-width:1.0;" x1="279" x2="279" y1="1010.0625" y2="1023.0625"/><line style="stroke:#181818;stroke-width:1.0;" x1="238" x2="279" y1="1023.0625" y2="1023.0625"/><polygon fill="#181818" points="248,1019.0625,238,1023.0625,248,1027.0625,244,1023.0625" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211" x="244" y="988.8545">stop the listener, drain the sessions,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76" x="244" y="1005.2061">then io.stop()</text><polygon fill="#181818" points="927,1049.4141,937,1053.4141,927,1057.4141,931,1053.4141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="237" x2="933" y1="1053.4141" y2="1053.4141"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182" x="244" y="1048.5576">io_.run() returns; workers joined</text><polygon fill="#181818" points="473,1079.7656,463,1083.7656,473,1087.7656,469,1083.7656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="467" x2="938" y1="1083.7656" y2="1083.7656"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238" x="479" y="1078.9092">Executor::stop(): wait for queued batches</text><line style="stroke:#181818;stroke-width:1.0;" x1="939" x2="981" y1="1114.1172" y2="1114.1172"/><line style="stroke:#181818;stroke-width:1.0;" x1="981" x2="981" y1="1114.1172" y2="1127.1172"/><line style="stroke:#181818;stroke-width:1.0;" x1="940" x2="981" y1="1127.1172" y2="1127.1172"/><polygon fill="#181818" points="950,1123.1172,940,1127.1172,950,1131.1172,946,1127.1172" style="stroke:#181818;stroke-width:1.0;"/><text 