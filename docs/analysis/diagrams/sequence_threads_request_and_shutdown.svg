ont-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83" x="33" y="193.0654">RESP request</text><line style="stroke:#181818;stroke-width:1.0;" x1="237" x2="279" y1="228.2734" y2="228.2734"/><line style="stroke:#181818;stroke-width:1.0;" x1="279" x2="279" y1="228.2734" y2="241.2734"/><line style="stroke:#181818;stroke-width:1.0;" x1="238" x2="279" y1="241.2734" y2="241.2734"/><polygon fill="#181818" points="248,237.2734,238,241.2734,248,245.2734,244,241.2734" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125" x="244" y="223.417">read, parse_pending()</text><polygon fill="#181818" points="445,267.625,455,271.625,445,275.625,449,271.625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="237" x2="451" y1="271.625" y2="271.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139" x="244" y="266.7686">Executor::run_on(batch)</text><line style="stroke:#181818;stroke-width:1.0;" x1="467" x2="509" y1="318.3281" y2="318.3281"/><line style="stroke:#181818;stroke-width:1.0;" x1="509" x2="509" y1="318.3281" y2="331.3281"/><line style="stroke:#181818;stroke-width:1.0;" x1="468" x2="509" y1="331.3281" y2="331.3281"/><polygon fill="#181818" points="478,327.3281,468,331.3281,478,335.3281,474,331.3281" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220" x="474" y="297.1201">CommandScope: stamp the heartbeat</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171" x="474" y="313.4717">(start time, generation, name)</text><line style="stroke:#181818;stroke-width:1.0;" x1="467" x2="509" y1="361.6797" y2="361.6797"/><line style="stroke:#181818;stroke-width:1.0;" x1="509" x2="509" y1="361.6797" y2="374.6797"/><line style="stroke:#181818;stroke-width:1.0;" x1="468" x2="509" y1="374.6797" y2="374.6797"/><polygon fill="#181818" points="478,370.6797,468,374.6797,478,378.6797,474,374.6797" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201" x="474" y="356.8232">run the command on the keyspace</text><path d="M658.5,389.6797 L731.5,389.6797 L731.5,398.0313 L721.5,408.0313 L658.5,408.0313 L658.5,389.6797 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="78.0547" style="stroke:#000000;stroke-width:1.5;" width="349" x="658.5" y="389.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="28" x="673.5" y="404.1748">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="256" x="746.5" y="403.0986">[every 100 ms, whatever the other threads do]</text><line style="stroke:#181818;stroke-width:1.0;" x1="730" x2="772" y1="446.7344" y2="446.7344"/><line style="stroke:#181818;stroke-width:1.0;" x1="772" x2="772" y1="446.7344" y2="459.7344"/><line style="stroke:#181818;stroke-width:1.0;" x1="731" x2="772" y1="459.7344" y2="459.7344"/><polygon fill="#181818" points="741,455.7344,731,459.7344,741,463.7344,737,459.7344" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195" x="737" y="425.5264">heartbeat(): has a command been</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167" x="737" y="441.8779">running past --watchdog-ms?</text><path d="M658.5,481.7344 L723.5,481.7344 L723.5,490.0859 L713.5,500.0859 L658.5,500.0859 L658.5,481.7344 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="78.0547" style="stroke:#000000;stroke-width:1.5;" width="288" x="658.5" y="481.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20" x="673.5" y="496.2295">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="203" x="738.5" y="495.1533">[the command is still running past it]</text><line style="stroke:#181818;stroke-width:1.0;" x1="730" x2="772" y1="538.7891" y2="538.7891"/><line style="stroke:#181818;stroke-width:1.0;" x1="772" x2="772" y1="538.7891" y2="551.7891"/><line style="stroke:#181818;stroke-width:1.0;" x1="731" x2="772" y1="551.7891" y2="551.7891"/><polygon fill="#181818" points="741,547.7891,731,551.7891,741,555.7891,737,551.7891" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="737" y="517.5811">warn, once per command</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121" x="737" y="533.9326">(ReportPolicy::Once)</text><line style="stroke:#181818;stroke-width:1.0;" x1="467" x2="509" y1="589.1406" y2="589.1406"/><line style="stroke:#181818;stroke-width:1.0;" x1="509" x2="509" y1="589.1406" y2="602.1406"/><line style="stroke:#181818;stroke-width:1.0;" x1="468" x2="509" y1="602.1406" y2="602.1406"/><polygon fill="#181818" points="478,598.1406,468,602.1406,478,606.1406,474,602.1406" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244" x="474" y="584.2842">CommandScope ends: clear the heartbeat</text><polygon fill="#181818" points="248,628.4922,238,632.4922,248,636.4922,244,632.4922" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="242" x2="461" y1="632.4922" y2="632.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="254" y="627.6357">continues_on(session strand)</text><polyg