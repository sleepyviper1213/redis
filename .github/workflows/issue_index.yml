name: Issue index

# Rebuilds docs/features/<feature>/issues.md from the issues labelled
# feat:<feature> (scripts/issue_index.py) and, when a file changed, opens or
# updates one pull request on the branch bot/issue-index. Nothing is pushed to
# the default branch: the docs change through a reviewed PR.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: issue-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rebuild the indexes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state all --limit 1000 \
            --json number,title,state,labels,body,url > "$RUNNER_TEMP/issues.json"
          python3 scripts/issue_index.py "$RUNNER_TEMP/issues.json"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/issue-index
        run: |
          if [ -z "$(git status --porcelain docs/features)" ]; then
            echo "Indexes are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add docs/features
          git commit -m "[docs] issue index: refresh from GitHub issues"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" \
              --title "[docs] issue index: refresh from GitHub issues" \
              --body "Generated by scripts/issue_index.py. Do not edit the files by hand; change the issues."
          fi
