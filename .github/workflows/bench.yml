name: Benchmark

# Runs scripts/bench_server.sh on Linux against Debian's redis-server, on
# demand, once per compiler. Each compiler has its own image, so neither
# installs the other's toolchain. The runners are shared VMs, so only the gap
# between the two servers in one job means anything, not the absolute numbers.

on:
  # Push any commit to a bench/ branch to benchmark it with the defaults:
  #   git push -f origin HEAD:bench/<name>
  # workflow_dispatch only works once this file is on the default branch.
  push:
    branches: ["bench/**"]
  workflow_dispatch:
    inputs:
      threads:
        description: redis-benchmark threads (THREADS)
        default: "2"
      requests:
        description: requests per scenario (REQUESTS)
        default: "200000"
      runs:
        description: repeats per scenario (RUNS)
        default: "7"

env:
  # Built dependencies are kept as plain files, restored and saved by
  # actions/cache below. vcpkg removed its x-gha backend.
  VCPKG_BINARY_SOURCES: clear;files,/root/vcpkg-cache,readwrite
  # Compiler objects are cached across runs: after a small edit only the
  # changed files recompile.
  CCACHE_DIR: /root/.ccache
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  bench:
    name: bench (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    # Both images are Debian, so the same packages (and the same redis-server)
    # come from apt. Ubuntu 24.04's own GCC 14 crashes (ICE) on Abseil
    # lts_20260107's any_invocable.h, hence gcc:16.2.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   image: "gcc:16.2",         preset: linux-gcc,   cc: gcc,   cxx: g++ }
          - { compiler: clang, image: "silkeh/clang:22",  preset: linux-clang, cc: clang, cxx: clang++ }
    env:
      # vcpkg builds the dependencies with the same compiler as the project.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install build tools and Redis
        # No systemd in a container, so the packaged Redis does not start;
        # bench_server.sh starts its own reference instance.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build git curl \
            ca-certificates zip unzip tar pkg-config ccache redis-server redis-tools
          ${CXX} --version | head -n 1
          redis-server --version
      - name: Install the latest CMake
        # Debian's is too old for vcpkg's scripts (they use string(JSON
        # STRING_ENCODE)), and VCPKG_FORCE_SYSTEM_BINARIES makes vcpkg use
        # the system one rather than download its own.
        run: |
          v="$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/Kitware/CMake/releases/latest | sed 's#.*/v##')"
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${v}/cmake-${v}-linux-x86_64.tar.gz" |
            tar -xz --strip-components=1 -C /usr/local
          cmake --version | head -n 1
      - uses: actions/checkout@v4
      - name: Use every core
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Point vcpkg at the container's workspace
        # github.workspace is the host's path; inside the container the
        # checkout is at $GITHUB_WORKSPACE.
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: scripts/bootstrap_vcpkg.sh
      - name: Restore the built dependencies
        # Named like ci.yml's cache (the configure preset), so what CI saved on
        # main is found here: a branch can read only its own caches and the
        # default branch's, so a new bench/ or profile/ branch starts cold
        # unless main has one.
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: /root/vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-
      - name: Configure (builds the dependencies)
        run: cmake --preset ${{ matrix.preset }}
      - name: Save the built dependencies
        # Right after the configure that built them, so a failure later (or a
        # cancelled run) does not throw away the slow part. Skipped on an exact
        # hit, and when the configure failed: a half-built cache saved under
        # the exact key would be restored, and never completed, from then on.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /root/vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}-release --target redis_server
          ccache --show-stats
      - name: Benchmark
        env:
          REF_SERVER: redis-server
          THREADS: ${{ inputs.threads || '2' }}
          SERVER_CPUS: "0-1"
          CLIENT_CPUS: "2-3"
          REQUESTS: ${{ inputs.requests || '200000' }}
          RUNS: ${{ inputs.runs || '7' }}
        run: |
          mkdir -p bench
          report="bench/${{ matrix.compiler }}.txt"
          echo "${{ matrix.compiler }}, runner: $(nproc) CPUs" | tee "$report"
          bash scripts/bench_server.sh ${{ matrix.preset }} Release | tee -a "$report"
          { echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        # Even when a later step fails. One artifact per job here (jobs cannot
        # share one); the merge job below combines them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.compiler }}
          path: bench/${{ matrix.compiler }}.txt
          if-no-files-found: warn

  merge:
    name: One artifact
    needs: bench
    # Even if one compiler's job failed: take whatever the other produced.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Merge the results into one artifact
        # Download "bench", unzip: gcc.txt, clang.txt.
        uses: actions/upload-artifact/merge@v4
        with:
          name: bench
          pattern: bench-*
          delete-merged: true
