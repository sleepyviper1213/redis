name: CI

# The preset is the contract: every job runs a workflow preset by name, so a
# red job reproduces locally with one command and no flag archaeology:
#
#     cmake --workflow --preset <preset>
#
# The project targets Linux and macOS (it forks for BGSAVE). Linux runs the
# full matrix including sanitizers; macOS builds with Homebrew LLVM.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Built dependencies live in this directory (vcpkg's default "files" binary
  # cache), saved and restored by actions/cache below. vcpkg removed x-gha.
  # Content-addressed by package ABI hash, so entries never clash.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    # One image per compiler, so a job carries only its own toolchain (Ubuntu's
    # own GCC 14 crashes on Abseil and its clang 18 lacks std::expected; both
    # images are Debian, as in bench.yml). ThreadSanitizer needs the host's
    # mmap ASLR entropy lowered, hence a privileged container for it.
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-debug,   configure: linux-gcc,   config: Debug,            image: "gcc:16.2",        cc: gcc,   cxx: g++ }
          - { preset: linux-gcc-release, configure: linux-gcc,   config: Release,          image: "gcc:16.2",        cc: gcc,   cxx: g++ }
          - { preset: linux-clang-debug, configure: linux-clang, config: Debug,            image: "silkeh/clang:22", cc: clang, cxx: clang++ }
          # linux-gcc-asan is off: GCC 16.2 rejects stdexec's let_value under
          # -fsanitize=address,undefined ("__mtypeid_v ... is not a constant
          # expression" in session.cpp). Re-enable once that is fixed.
          # - { preset: linux-gcc-asan,    configure: linux-gcc,   config: AddressSanitizer, image: "gcc:16.2",        cc: gcc,   cxx: g++ }
          - { preset: linux-gcc-tsan,    configure: linux-gcc,   config: ThreadSanitizer,  image: "gcc:16.2",        cc: gcc,   cxx: g++, options: --privileged }
    env:
      # vcpkg builds the dependencies with the same compiler as the project.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Compiler objects are cached across runs: after a small edit only the
      # changed files recompile.
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build git curl             ca-certificates zip unzip tar pkg-config ccache
          ${CXX} --version | head -n 1
          command -v ninja
          ninja --version
      - name: Allow ThreadSanitizer's memory layout
        # The default mmap ASLR entropy collides with TSan's shadow memory and
        # every instrumented binary aborts at startup.
        if: matrix.config == 'ThreadSanitizer'
        run: sysctl vm.mmap_rnd_bits=28
      - name: Install the latest CMake
        # The pinned vcpkg's scripts need a newer CMake than Debian has, and
        # the presets make vcpkg use the system one
        # (VCPKG_FORCE_SYSTEM_BINARIES).
        run: |
          v="$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/Kitware/CMake/releases/latest | sed 's#.*/v##')"
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${v}/cmake-${v}-linux-x86_64.tar.gz" |
            tar -xz --strip-components=1 -C /usr/local
          cmake --version | head -n 1
      - uses: actions/checkout@v4
      - name: Use every core
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Point vcpkg at the container's paths
        # github.workspace is the host's path; inside the container the
        # checkout is at $GITHUB_WORKSPACE.
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=/root/vcpkg-cache" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: scripts/bootstrap_vcpkg.sh
      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: /root/vcpkg-cache
          key: vcpkg-${{ matrix.configure }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.configure }}-
      - name: Make the cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure, build and unit test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Integration test
        run: scripts/test_server.sh ${{ matrix.configure }} ${{ matrix.config }}

  macos:
    name: macos-arm64-llvm-debug
    runs-on: macos-15
    env:
      # Compiler objects are cached across runs: after a small edit only the
      # changed files recompile.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - name: Use every core
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Install toolchain
        # Homebrew LLVM, not AppleClang: see cmake/toolchains/homebrew-llvm.cmake.
        run: brew install llvm ninja cmake ccache
      - name: Bootstrap vcpkg
        run: scripts/bootstrap_vcpkg.sh
      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-macos-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-macos-
      - name: Make the cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-
      - name: Configure, build and unit test
        run: cmake --workflow --preset macos-arm64-llvm-debug
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Integration test
        run: scripts/test_server.sh macos-arm64-llvm Debug

  analysis:
    name: Static analysis (clang-tidy, cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-16 clang-22 clang-tidy-22 cppcheck
          for t in clang clang++ clang-tidy; do
            sudo update-alternatives --install /usr/bin/$t $t /usr/bin/$t-22 200
            sudo update-alternatives --set $t /usr/bin/$t-22
          done
          clang++ --version | head -n 1
      - name: Install the latest CMake
        # The pinned vcpkg's scripts need a newer CMake than the runner image
        # has, and the presets make vcpkg use the system one
        # (VCPKG_FORCE_SYSTEM_BINARIES).
        run: |
          v="$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/Kitware/CMake/releases/latest | sed 's#.*/v##')"
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${v}/cmake-${v}-linux-x86_64.tar.gz" |
            sudo tar -xz --strip-components=1 -C /usr/local
          cmake --version | head -n 1
      - name: Bootstrap vcpkg
        run: scripts/bootstrap_vcpkg.sh
      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-analysis-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-analysis-
      - name: Make the cache directory
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      # Both analysers run as compiler launchers, so building is analysing.
      # Clang rather than GCC: clang-tidy re-parses the compiler's own command
      # line, which needs no reconciliation on a Clang tree.
      - name: Configure and analyse
        run: cmake --workflow --preset linux-clang-analysis
