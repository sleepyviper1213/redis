name: Benchmark A/B

# Builds two revisions on one Linux runner and benchmarks them with
# scripts/bench_server.sh, alternating between them, with Debian's redis-server
# beside each. The runners are shared VMs, so only the gap between the two
# revisions in this job means anything, not the absolute numbers; each side's
# ratio to the reference server is the figure that survives a change of runner.
#
# The server is pinned to CPUs 0-1 and redis-benchmark to 2-3, as in bench.yml,
# and the `saturate` scenario drives the server past what one client thread
# offers, so that a cheaper request shows as a higher rate (see
# docs/features/connection/io_uring_experiment.md, stage 1c, TC-298).
#
# Push any commit to a bench-ab/ branch to compare it with BASE:
#   git push origin HEAD:bench-ab/<name>

on:
  push:
    branches: ["bench-ab/**"]
  workflow_dispatch:
    inputs:
      base:
        description: revision to compare against
        default: a9e892f
      threads:
        description: redis-benchmark threads (THREADS)
        default: "2"
      requests:
        description: requests per scenario (REQUESTS)
        default: "200000"
      runs:
        description: repeats per scenario (RUNS)
        default: "5"
      rounds:
        description: times each revision is benchmarked, alternating
        default: "2"
      clients:
        description: connections in the saturate scenario (SATURATE_CLIENTS)
        default: "500"

env:
  # The commit before the read-path change (TC-298, stage 1b).
  BASE: ${{ inputs.base || 'a9e892f' }}
  VCPKG_BINARY_SOURCES: clear;files,/root/vcpkg-cache,readwrite
  CCACHE_DIR: /root/.ccache
  CCACHE_MAXSIZE: 500M
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  PRESET: x86_64-linux-gnu-gcc

jobs:
  ab:
    name: bench A/B (gcc)
    runs-on: ubuntu-24.04
    # Ubuntu 24.04's own GCC 14 crashes (ICE) on Abseil lts_20260107's
    # any_invocable.h, hence gcc:16.2 (as in bench.yml). Not privileged: the
    # benchmark needs no perf.
    container: gcc:16.2
    # Two builds and several rounds: a stuck job is cut off.
    timeout-minutes: 90
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install build tools and Redis
        # util-linux brings taskset, for the CPU pinning. No systemd in a
        # container, so the packaged Redis does not start; bench_server.sh
        # starts its own reference instance.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ninja-build git curl \
            ca-certificates zip unzip tar pkg-config ccache util-linux \
            redis-server redis-tools
          ${CXX} --version | head -n 1
          redis-server --version
          command -v taskset
      - name: Install the latest CMake
        run: |
          v="$(curl -sIL -o /dev/null -w '%{url_effective}' https://github.com/Kitware/CMake/releases/latest | sed 's#.*/v##')"
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${v}/cmake-${v}-linux-x86_64.tar.gz" |
            tar -xz --strip-components=1 -C /usr/local
          cmake --version | head -n 1
      - uses: actions/checkout@v4
        with:
          # Both revisions are needed.
          fetch-depth: 0
      - name: Use every core
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - name: Point vcpkg at the container's workspace
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        run: scripts/bootstrap_vcpkg.sh
      - name: Restore the built dependencies
        # Named like ci.yml's cache, so what CI saved on main is found here.
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: /root/vcpkg-cache
          key: vcpkg-${{ env.PRESET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.PRESET }}-
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-ab-${{ github.sha }}
          restore-keys: ccache-ab-
      - name: Check out both revisions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add ../redis-base "$BASE"
          git worktree add ../redis-new "$GITHUB_SHA"
          git -C ../redis-base log --oneline -1
          git -C ../redis-new log --oneline -1
      - name: Configure the new revision (builds the dependencies)
        run: cd ../redis-new && cmake --preset "$PRESET"
      - name: Save the built dependencies
        # Right after the configure that built them. Skipped on an exact hit.
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /root/vcpkg-cache
          key: vcpkg-${{ env.PRESET }}-${{ hashFiles('vcpkg.json') }}
      - name: Build the new revision
        run: |
          cd ../redis-new
          cmake --build --preset "$PRESET-release" --target redis_server
          ccache --show-stats
      - name: Configure and build the base revision
        # The dependencies come from the cache the new revision filled.
        run: |
          cd ../redis-base
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET-release" --target redis_server
          ccache --show-stats
      - name: Both servers are there
        run: |
          for side in base new; do
            ls -l "../redis-$side/build/$PRESET/src/app/Release/redis_server"
          done
      - name: Benchmark, alternating
        env:
          REF_SERVER: redis-server
          THREADS: ${{ inputs.threads || '2' }}
          SERVER_CPUS: "0-1"
          CLIENT_CPUS: "2-3"
          REQUESTS: ${{ inputs.requests || '200000' }}
          RUNS: ${{ inputs.runs || '5' }}
          SATURATE_CLIENTS: ${{ inputs.clients || '500' }}
        run: |
          mkdir -p bench
          report=bench/ab.txt
          echo "base $BASE, new $GITHUB_SHA, runner: $(nproc) CPUs" | tee "$report"
          # The new revision's scripts run both sides, so both see the same
          # scenarios (the base predates the saturate scenario).
          cp ../redis-new/scripts/bench_server.sh ../redis-new/scripts/common.sh \
            ../redis-base/scripts/
          rounds="${{ inputs.rounds || '2' }}"
          for i in $(seq "$rounds"); do
            # The order flips each round, so neither side is always first.
            if (( i % 2 )); then sides="base new"; else sides="new base"; fi
            for side in $sides; do
              echo "== $side (round $i) ==" | tee -a "$report"
              ( cd "../redis-$side" &&
                bash scripts/bench_server.sh "$PRESET" Release ) | tee -a "$report"
            done
          done
          { echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ab
          path: bench/ab.txt
          if-no-files-found: warn
